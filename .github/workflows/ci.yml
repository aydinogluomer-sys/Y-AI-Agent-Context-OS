name: Y-AI-Agent-Context-OS CI Pipeline

on:
  push:
    # `main` DISINDAKI dallarda da kosar.
    #
    # Entegrasyon kapisi (pgvector servisi + test:integration) yazildi ama
    # GitHub Actions'ta hic calismamisti. Yerel Docker ile Actions'in
    # `services:` blogu ayni sey degil: imaj cekme, saglik kontrolu
    # zamanlamasi, ag adi ve eklenti kurulumu farkli davranir.
    #
    # Kapinin CI'da gercekten calistigi, main'e girmeden ONCE gorulmeli.
    branches: [ main, 'feat/**' ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Build, Lint, DB Integration & Deterministic Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        # [P19/T1] pgvector ZORUNLU: postgres:15 eklentiyi ICERMEZ ve
        # entegrasyon testleri `CREATE EXTENSION vector` ile patlardi.
        # Yerel docker-compose ile AYNI imaj: CI ile gelistirici
        # makinesinin farkli Postgres surumu calistirmasi, yalniz
        # birinde ortaya cikan hatalar uretir.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          # [P19] PAROLA YOK. CI servisi yalniz is konteynerinden
          # erisilebilir; parola tutmak depoda gereksiz bir kimlik
          # bilgisi birakir ve sir tarayicisi bunu HAKLI OLARAK bulgu
          # sayar. Yerel docker-compose ile ayni karar.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: y_vault
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm Package Manager
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # ---------------------------------------------------------------
      # P17 / P19 — DÜRÜSTLÜK GATE'LERİ
      #
      # Bu adımlar P00 Truth Audit'in bulgularının geri gelmesini
      # engeller. Her biri GERÇEKTEN KIRILABİLİR olduğu doğrulanmıştır;
      # kırılamayan bir gate, olmayan bir gate'tir.
      # ---------------------------------------------------------------

      - name: "Gate — Strict Typecheck (kanonik kod)"
        # `tsconfig.strict.json` yalnizca kanonik yollar icin strict.
        # Legacy kod hala loose; ikisi ayri ayri kosuyor.
        run: pnpm run typecheck

      - name: "Gate — Envanter drift (audit dokumanlari kaynakla tutarli mi)"
        # P00'daki 30+ dokuman kaynaktan kopmustu. Bu gate, audit
        # ciktilarinin kod degistiginde bayatlamasini engeller.
        run: pnpm run gate:drift

      - name: "Gate — False-green circiri (borc ARTAMAZ)"
        # Sifir degil CIRCIR: bugunku borc kabul edilir, YENI borc
        # reddedilir. "Bulgu > 0 ise fail" kurali CI'i kalici kirar ve
        # kirik bir gate, kapatilan bir gate'tir.
        run: pnpm run gate:false-green

      - name: "Gate — Birim ve sozlesme testleri"
        run: pnpm exec vitest run

      - name: "Gate — Migration esleme tazeligi"
        # MAPPING.md yeniden uretilir; fark varsa birileri migration
        # ekleyip eslemeyi guncellememis demektir.
        run: |
          pnpm run migrations:mapping
          git diff --exit-code migrations/MAPPING.md


      - name: Secret Leak Scan
        run: pnpm run secret-scan

      # ---------------------------------------------------------------
      # KALDIRILDI [P20/FAZ 2] — "Deterministic Validation Suite"
      #
      # Bu adim `pnpm run test:deterministic` cagiriyordu. O script
      # ARTIK YOK: `legacy:test:deterministic` olarak yeniden
      # adlandirilmis. Yani adim, adlandirmadan bu yana HER kosuda
      # "Missing script" ile dusuyordu — ama CI'in kendisi hic
      # kosturulmadigi icin kimse gormedi. OLU BIR KAPI.
      #
      # Adi duzeltmek yetmiyor. Suit uc ayri sebeple gecemez:
      #
      #   1. SEMA UYUMSUZLUGU. Stage 23/24/25/27 `projects` tablosuna
      #      `organization_id` OLMADAN yaziyor. Migration
      #      2.0.5-projects-organization-scope o kolonu NOT NULL yapti.
      #      Ayni sekilde `audit_logs.actor_principal_id`. Bu
      #      dogrulayicilar cok kiracilik ONCESI semaya gore yazilmis.
      #
      #   2. ORTAM UYUMSUZLUGU. `y_user` rolu ve pooler/TLS
      #      yapilandirmasi bekliyor; ikisi de bu projede yok.
      #
      #   3. MOD CELISKISI. `deterministic` mod TANIMI GEREGI
      #      veritabanisiz kosar (run-validation-suite.ts:40). Adim ise
      #      ona DATABASE_URL veriyordu; DB'ye bagli asamalar calisiyor
      #      ve patliyordu.
      #
      # `continue-on-error: true` ile yesile boyamak bu projede yasak
      # olan seyin ta kendisi (spec 37): gecmeyen bir kapinin GECTI
      # gorunmesi. Kapi ya gercekten gecer ya da orada olmaz.
      #
      # Kapsami zaten karsilanan yer: vitest suiti (1330 test), canli
      # Postgres entegrasyon suiti (64 test) ve mutasyon kapisi.
      # `scripts/run-validation-suite.ts` depoda KALIYOR; silinmedi.
      #
      # Geri getirmenin kosulu: legacy dogrulayicilarin guncel cok
      # kiracili semaya gore yeniden yazilmasi. Kayit:
      # docs/implementation.md FAZ 2.
      # ---------------------------------------------------------------

      - name: "Gate — CI script referanslari"
        # Bu kapi P20'de eklendi cunku CI, ADI DEGISMIS bir script'i
        # cagirmaya devam ediyordu ve adim aylarca "Missing script" ile
        # dusuyordu. CI hic kosturulmadigi icin kimse gormedi.
        # Yerelde saniyeler surer ve o hata sinifini kapatir.
        run: pnpm run gate:ci-scripts

      - name: "Gate — Route kapsam muhafizi"
        # Muhafizin CALISTIGINI idor.spec.ts kanitliyor. Bu kapi farkli
        # bir soruyu cevapliyor: muhafiz her yere TAKILI MI? Calisan ama
        # bir route'a takilmamis muhafiz, o route'ta hicbir sey yapmaz.
        run: pnpm run gate:route-scope

      - name: Database Migrations

        run: pnpm run db:migrate
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/y_vault

      - name: Entegrasyon veritabanini olustur
        # AYRI VERITABANI - `y_vault` DEGIL.
        #
        # `db:migrate` adimi migration'lari y_vault/public'e uygular ve
        # `vector` eklentisini oraya kurar. Entegrasyon testleri ise her
        # dosyaya izole bir sema verir ve search_path'i `<sema>, ext`
        # olarak ayarlar (P21/4: `public` bilerek yolun disinda).
        #
        # Ayni veritabanini paylasirlarsa: eklenti zaten public'te
        # oldugu icin `CREATE EXTENSION ... SCHEMA ext` onu TASIMAZ,
        # test semasi `vector` tipini cozemez ve migration patlar.
        # CI #31/#32 tam bu sebeple dustu; yerelde `db:test:reset`
        # public'i temizledigi icin gorunmemisti.
        run: psql "postgresql://postgres@localhost:5432/postgres" -c 'CREATE DATABASE y_integration;'

      - name: "Gate — Entegrasyon testleri (CANLI Postgres)"
        # Bu kapi, sorgu SEKLINI degil SONUCUNU dogrular.
        #
        # Yerel kosuda iki gercek uretim hatasi bu kapiyla ayni
        # testlerden cikti: migration 0051 hic uygulanmamisti ve graph
        # traversal recursive CTE tip uyusmazligi yuzunden hic
        # calismamisti. Ikisini de birim testleri kaciriyordu.
        #
        # DB yoksa test SESSIZCE ATLAMAZ, acikca hata verir (spec §37).
        run: pnpm run test:integration
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/y_integration
          WORKER_SIGNING_KEY: ci-integration-signing-key-32-chars-min

      - name: Install Playwright Browsers
        run: pnpm run test:e2e:install

      - name: "Gate — E2E duman testleri (URETIM PAKETI)"
        # Bu adim P21/1'de eklendi. Onceki CI Playwright TARAYICILARINI
        # KURUYOR ama testleri HIC KOSMUYORDU: `test:e2e:install` vardi,
        # `test:e2e` yoktu. Tarayicilar bosuna kuruluyordu.
        #
        # `test:e2e` once `build` calistirir ve testler URETIM paketine
        # karsi kosar, dev sunucusuna degil: vite dev modulleri istek
        # aninda derler ve CI'da onbellek her zaman soguktur.
        run: pnpm run test:e2e
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/y_vault

      - name: Build Web & API Packages
        run: pnpm run build
