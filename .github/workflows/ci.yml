name: Y-AI-Agent-Context-OS CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Build, Lint, DB Integration & Deterministic Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: y_vault
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm Package Manager
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript Typecheck
        run: pnpm run typecheck

      - name: Secret Leak Scan
        run: pnpm run secret-scan

      - name: Deterministic Validation Suite
        run: pnpm run test:deterministic
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/y_vault

      - name: Database Migrations
        run: pnpm run db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/y_vault

      - name: Build Web & API Packages
        run: pnpm run build
