<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
    <script>
      // Only silence benign local development Vite WebSocket HMR connection failures, leaving all other errors uncaught
      var isDevelopment = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.port !== '';
      
      function renderDiagnosticError(title, message, stack) {
        function show() {
          var errDiv = document.getElementById('y-diagnostic-error');
          if (errDiv) return;
          
          errDiv = document.createElement('div');
          errDiv.id = 'y-diagnostic-error';
          errDiv.style.position = 'fixed';
          errDiv.style.top = '0';
          errDiv.style.left = '0';
          errDiv.style.width = '100vw';
          errDiv.style.height = '100vh';
          errDiv.style.backgroundColor = '#0b0f19';
          errDiv.style.color = '#f3f4f6';
          errDiv.style.fontFamily = 'system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
          errDiv.style.padding = '2rem';
          errDiv.style.boxSizing = 'border-box';
          errDiv.style.zIndex = '999999';
          errDiv.style.overflow = 'auto';
          
          var content = '';
          content += '<div style="max-width: 800px; margin: 4rem auto 0 auto; background: #1f2937; border: 1px solid #ef4444; border-radius: 8px; padding: 2rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5);">';
          content += '  <h1 style="color: #ef4444; margin-top: 0; font-size: 1.5rem; display: flex; align-items: center; gap: 0.5rem;">';
          content += '    <svg style="width:24px;height:24px;flex-shrink:0" viewBox="0 0 24 24"><path fill="currentColor" d="M12,2L1,21H23M12,6L19.8,19H4.2M11,10V14H13V10M11,16V18H13V16"/></svg>';
          content += '    ' + title;
          content += '  </h1>';
          content += '  <div style="background: #111827; padding: 1rem; border-radius: 4px; font-family: monospace; margin: 1rem 0; border-left: 4px solid #ef4444; word-break: break-all; white-space: pre-wrap;">' + message + '</div>';
          if (stack) {
            content += '  <h3 style="margin-top: 1.5rem; font-size: 1rem; color: #9ca3af;">Stack Trace</h3>';
            content += '  <pre style="background: #111827; padding: 1rem; border-radius: 4px; font-family: monospace; overflow-x: auto; font-size: 0.85rem; color: #d1d5db; max-height: 300px; border: 1px solid #374151;">' + stack + '</pre>';
          }
          content += '  <p style="color: #9ca3af; font-size: 0.875rem; margin-top: 1.5rem;">Please check the browser console or server terminal log for deeper insights. If you are pair programming with Antigravity, share this error message to resolve the issue.</p>';
          content += '</div>';
          
          errDiv.innerHTML = content;
          document.body.appendChild(errDiv);
        }
        if (document.body) {
          show();
        } else {
          window.addEventListener('DOMContentLoaded', show);
        }
      }

      window.addEventListener('unhandledrejection', function(event) {
        if (isDevelopment && event.reason) {
          var msg = String(event.reason.message || event.reason);
          if (
            msg.indexOf('failed to connect to websocket') !== -1 ||
            msg.indexOf('WebSocket closed without opened') !== -1
          ) {
            event.preventDefault();
            event.stopPropagation();
            return;
          }
          renderDiagnosticError('Y-OS Boot Exception (Unhandled Rejection)', msg, event.reason.stack);
        }
      }, true);
      
      window.addEventListener('error', function(event) {
        if (isDevelopment) {
          if (!event.message) return; // Ignore resource load errors
          var msg = String(event.message || '');
          if (
            msg.indexOf('failed to connect to websocket') !== -1 ||
            msg.indexOf('WebSocket closed without opened') !== -1
          ) {
            event.preventDefault();
            event.stopPropagation();
            return;
          }
          renderDiagnosticError('Y-OS Boot Exception (Runtime Error)', msg, event.error ? event.error.stack : '');
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
